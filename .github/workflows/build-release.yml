# build-release.yml —— release 版 APK 自动构建与发布（v0.1.0）
#
# 设计对齐先例：pi-desktop-android 同名 workflow（build-release.yml）的签名/发布范式。
# 本项目为纯多模块 Android App（无 pi-web 载荷/品牌素材/CLI 投放），故较先例精简。
#
# 触发：
#   push v* tag（如 v0.1.0）   → 构建 + GitHub Release 发布
#   workflow_dispatch（手动） → 仅构建验证 + artifact 留存，不发布
#
# 签名：secrets 可选注入
#   ANDROID_KEYSTORE   （keystore 的 base64 -w0 编码，解密后用 keytool 自检）
#   KEYSTORE_PASSWORD  （store 口令）
#   KEY_ALIAS          （密钥别名）
#   KEY_PASSWORD       （密钥口令）
#   四者齐全 → VARIANT=release（签名包）；全缺 → VARIANT=debug（debug 签名兜底）；
#   部分配置 → ::error:: 显式失败。签名材料零入库。
#
# 版本：不把 tag 注入 versionName/versionCode；tag 仅用于 Release/APK 命名。
#   versionName 0.1.0 / versionCode 1 见 app/build.gradle.kts。

name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # gh-release：创建 Release 与上传附件（最小权限）

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: APK → 校验 → Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ── 检出 ────────────────────────────────────────────────────────────────
      - name: 检出本仓库
        uses: actions/checkout@v4

      # ── 工具链 ──────────────────────────────────────────────────────────────
      - name: JDK 17（AGP 9.x）+ Gradle 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 授权 gradlew 可执行
        run: chmod +x gradlew

      # ── 签名注秘（可选；无 secrets → debug 签名兜底）────────────────────────
      - name: 签名注秘（有 secrets → VARIANT=release；无 → debug）
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE:-}" ]; then
            for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!v:-}" ]; then
                echo "::error::签名 secrets 部分配置：$v 为空 —— 请配齐 ANDROID_KEYSTORE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四项（或全部删除走 debug 兜底）"
                exit 1
              fi
            done
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > rpandroid-release.jks
            # 值不可回读，keytool 自检是部署正确性的唯一可观测证据
            keytool -list -keystore rpandroid-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
            umask 077
            printf 'storeFile=rpandroid-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
            echo "::notice::未配置签名 secrets —— 产出 debug 签名 APK（可直接安装）。发布正式签名包请配置 ANDROID_KEYSTORE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四个 secrets（keystore 用 base64 -w0 编码）。"
          fi

      # ── APK（hosted runner 预装 Android SDK，license 已接受，缺组件 AGP 自动补装）──
      - name: APK 构建（assembleRelease / assembleDebug）
        run: ./gradlew :app:assemble${VARIANT} --stacktrace --no-daemon

      # ── 产物收集 + 校验 ──────────────────────────────────────────────────────
      - name: 产物校验（包名/版本/对齐/release 追加签名）
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          export PATH="$BT:$PATH"
          LOWER_VARIANT="${VARIANT,,}"
          APK="app/build/outputs/apk/${LOWER_VARIANT}/app-${LOWER_VARIANT}.apk"
          test -f "$APK"
          echo "── 包名 / 应用名 / 版本 ──"
          aapt2 dump badging "$APK" 2>/dev/null | grep -E '^package:|application-label:' || true
          echo "── 16KB 对齐 ──"
          (zipalign -c -P 16 -v 4 "$APK" | tail -3) || echo "(zipalign 显示未 16KB 对齐为信息性提示)"
          if [ "${VARIANT}" = "release" ]; then
            mkdir -p dist
            cp "$APK" dist/rpauto-${GITHUB_REF_NAME:-manual}.apk
            echo "── 签名验证 ──"
            apksigner verify --print-certs "$APK" | sed -n '1,6p'
          else
            mkdir -p dist
            cp "$APK" dist/rpauto-${GITHUB_REF_NAME:-manual}-debug.apk
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -l dist

      - name: 上传 artifact（无论是否发布均留存）
        uses: actions/upload-artifact@v4
        with:
          name: rpauto-${{ github.ref_name || 'manual' }}
          path: dist/

      # ── 发布（仅 v* tag 触发；workflow_dispatch 到此为止）────────────────────
      - name: GitHub Release（仅 refs/tags/v*）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RPAuto ${{ github.ref_name }}
          body: >
            自动构建产物 · 变体 ${{ env.VARIANT }} · 包名 top.fellow99.rpauto ·
            arm64-v8a（node-runtime 26.13.0）· 校验请比对附件 SHA256SUMS ·
            构建提交 ${{ github.sha }}。
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
